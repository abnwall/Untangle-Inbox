                                                <div key={cf.k} class="ldr-fact">
                                                    <div class="ldr-fact-k">{cf.k}</div>
                                                    <div class="ldr-fact-v">{cf.v}</div>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="ldr-cfg-quotes">
                                            <div class="ldr-card-title-row">
                                                <div class="ldr-card-title">{prospectDetail.quotesTitle}</div>
                                                <template lwc:if={prospectDetail.hasMoreQuotes}>
                                                    <button class="ldr-pill-btn" onclick={toggleCfgQuotes}>{prospectDetail.quotesToggleLabel}</button>
                                                </template>
                                            </div>
                                            <template for:each={prospectDetail.quotes} for:item="cq">
                                                <div key={cq.key} class="ldr-cfg-quote">
                                                    <span class="ldr-cfg-q-when">{cq.when}</span>
                                                    <span class="ldr-cfg-q-model">{cq.model}</span>
                                                    <span class="ldr-cfg-q-project">{cq.project}</span>
                                                    <span class="ldr-strong">{cq.price}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <template lwc:if={prospectDetail.hasCfg}>
                                        <div class="ldr-card">
                                            <div class="ldr-card-title-row">
                                                <div class="ldr-card-title">Renders from the latest quote</div>
                                                <span class="ldr-small ldr-muted">Click a tile to expand</span>
                                            </div>
                                            <div class="ldr-cfg-previews">
                                                <template for:each={prospectDetail.previews} for:item="pv">
                                                    <div key={pv.key} class="ldr-cfg-tile">
                                                        <button class="ldr-cfg-tile-btn" data-index={pv.index} onclick={openCfgPreview}>
                                                            <template lwc:if={pv.hasImage}>
                                                                <img class="ldr-cfg-img" src={pv.url} alt={pv.label}/>
                                                            </template>
                                                            <template lwc:else>
                                                                <div class="ldr-cfg-noimg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#707070" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect><circle cx="8.5" cy="9.5" r="1.8"></circle><path d="M21 16l-5-5-8 9"></path></svg><div class="ldr-small ldr-muted">No link yet</div></div>
                                                            </template>
                                                        </button>
                                                        <div class="ldr-cfg-label">{pv.label}</div>
                                                        <div class="ldr-cfg-sub">{pv.sub}</div>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="ldr-small ldr-muted ldr-cfg-note">Only the main render has a link in Salesforce today (Render_File_URL__c). The four position renders are IDs only: Position_file_image_1_Id__c to _4_Id__c (the new fields; until they are populated, the IDs shown here come from Position_File_Ids__c). An ID can't be opened by itself, so each image also needs a link, like the main render has.</div>
                                        </div>
                                    </template>
                                    <div class="ldr-card">
                                        <div class="ldr-card-title">Files on the latest quote</div>

                                                <template lwc:if={fr.isGroup}>
                                                    <div class="ldr-cfg-file-group">{fr.label}</div>
                                                </template>
                                                <template lwc:if={fr.isFile}>
                                                    <div class="ldr-cfg-file">
                                                        <div class={fr.tileCls}>{fr.tile}</div>
                                                        <div class="ldr-grow"><div class="ldr-strong">{fr.label}</div><div class="ldr-small ldr-muted">{fr.hint}</div></div>

                                                        <template lwc:if={fr.noLink}>
                                                            <span class="ldr-small ldr-muted">{fr.noLinkText}</span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <div class="ldr-small ldr-muted ldr-cfg-note">These are the links stored on the quote. Salesforce does not record whether someone downloaded a file. The exact Revit, IFC and drawing files exist on only some quotes, so they are the best hint of a request; the specification and saved project are on nearly every quote. The XML file and the product manuals are also attached to most quotes and are not listed here.</div>
                                    </div>
                                </template>
                            </template>

                            <div class="ldr-card">
                                <div class="ldr-card-title">What they submitted</div>
                                <div class="ldr-facts ldr-facts-submitted">
                                    <template for:each={active.facts} for:item="f">

                                            <div class="ldr-fact-k">{f.k}</div>

                                            <template lwc:else>
                                                <div class={f.cls}>{f.v}</div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <template lwc:if={active.hasNearbyShowroom}>

                                <div class="ldr-comments">
                                    <div class="ldr-fact-k">Questions or comments</div>

                            <template lwc:if={detailExtras.hasCeNote}>
                                <div class={detailExtras.ceNoteCls} style={detailExtras.ceNoteStyle}>

                                    <div class="ldr-ce-note-text">{detailExtras.ceNoteText}</div>

                            <template lwc:if={active.hasAttachments}>

                                    <div class="ldr-attachments">
                                        <template for:each={active.attachments} for:item="att">
                                            <div key={att.key} class="ldr-att-tile">
                                                <template lwc:if={att.isImage}>
                                                    <button class="ldr-att-thumb-btn" data-url={att.url} data-label={att.label} onclick={openLightbox} title={att.name}>

                            <template lwc:if={hasPersonOthers}>

                            <template lwc:if={hasRelated}>
                                <div class="ldr-card ldr-card-related ldr-panel-green">

                                    <template for:each={relatedShown} for:item="r">
                                        <button key={r.key} class="ldr-related-row" data-id={r.recordId} onclick={openRelated}>
                                            <div class="ldr-min0">
                                                <div class="ldr-related-head">
                                                    <span class={r.kindCls}>{r.kind}</span>
                                                    <span class="ldr-strong">{r.name}</span>
                                                </div>
                                                <div class="ldr-small">{r.summary}</div>

                                                    <div class="ldr-small ldr-rel-note">{r.note}</div>
                                                </template>

                                                <div class="ldr-strong">{r.amountText}</div>
                                                <div class="ldr-muted ldr-small">{r.amountLabel}</div>
                                                <div class="ldr-muted ldr-small">{r.whenLabel}</div>

                                                    <div class="ldr-muted ldr-small">Status: {r.status}</div>

                                    <template lwc:if={hasMoreRelated}>

                                            <button class="ldr-btn ldr-btn-small" onclick={toggleRelated}>{relatedToggleLabel}</button>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template lwc:if={active.showWindfall}>
                                <div class="ldr-card">
                                    <div class="ldr-card-title">Windfall Information</div>
                                    <template lwc:if={active.windfallEmpty}>
                                        <div class="ldr-muted ldr-small ldr-hint-line">No Windfall data on this {active.recordObject}.</div>
                                    </template>
                                    <template lwc:if={active.windfallFromLead}>
                                        <div class="ldr-small ldr-hint-line ldr-wf-fromlead">From the converted Lead. Windfall reaches the Contact a day or two after conversion, so these are the Lead's values (also in the FETR).</div>
                                    </template>
                                    <div class="ldr-facts">
                                        <template for:each={active.windfallFacts} for:item="w">
                                            <div key={w.k}>
                                                <div class="ldr-fact-k">{w.k}</div>
                                                <div class="ldr-fact-v">{w.v}</div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={hasRepFlag}>
                                <div class={repFlag.cls}>
                                    <div class="ldr-strong ldr-rep-head">ℹ This customer also submitted a Representative-contact request {repFlag.whenLabel} ({repFlag.gapPhrase}).</div>
                                    <template lwc:if={repFlag.isLong}>
                                        <div class="ldr-rep-long">Long gap — likely means they couldn't get connected to the rep and came back to the site. Worth reaching out yourself rather than assuming the rep has it.</div>
                                    </template>
                                    <template lwc:else>
                                        <div class="ldr-rep-short">Short gap — likely still with the rep. Probably safe to defer unless you hear otherwise.</div>
                                    </template>
                                </div>
                            </template>

                            <template lwc:if={active.hasMatchedAccount}>
                                <div>
                                    <div class="ldr-section-title">Matched account: {active.matchedAccountName}</div>
                                    <div class="ldr-card">
                                        <div class="ldr-match-top">
                                            <span class="ldr-pill-outline">LeanData match</span>
                                        </div>
                                        <div class="ldr-match-stats">
                                            <div>
                                                <div class="ldr-fact-k">Past opportunities</div>
                                                <div class="ldr-stat">{active.matchedOppCount}</div>
                                            </div>
                                            <div>
                                                <div class="ldr-fact-k">Past orders</div>
                                                <div class="ldr-stat">{active.matchedOrderCount}</div>
                                            </div>
                                            <div>
                                                <div class="ldr-fact-k">City / State</div>
                                                <div class="ldr-fact-v">{matchedLocation}</div>
                                            </div>
                                            <div>
                                                <div class="ldr-fact-k">Website</div>
                                                <div class="ldr-fact-v">{matchedWebsite}</div>
                                            </div>
                                        </div>
                                        <template lwc:if={active.matchedIsCompetitor}>
                                            <div class="ldr-competitor">⚠ This account also works with a competitor</div>
                                        </template>
                                        <div class="ldr-fact-k ldr-strong-k">Opportunities this account has worked on</div>
                                        <template lwc:if={noAccountOpps}>
                                            <div class="ldr-muted ldr-small">None on this account yet.</div>
                                        </template>
                                        <template lwc:if={hasAccountOpps}>
                                            <template for:each={accountOpps} for:item="o">
                                                <button key={o.key} class={o.cardCls} data-id={o.recordId} onclick={openRelated}>
                                                    <div class="ldr-opp-head">
                                                        <span class="ldr-strong ldr-opp-name">{o.name}</span>
                                                        <span class={o.stageCls}>{o.status}</span>
                                                    </div>
                                                    <div class="ldr-opp-grid">
                                                        <div><div class="ldr-fact-k">Amount</div><div class="ldr-fact-v">{o.amountLabel}</div></div>
                                                        <div><div class="ldr-fact-k">Created</div><div class="ldr-fact-v">{o.createdLabel}</div></div>
                                                        <div><div class="ldr-fact-k">Expected resolution</div><div class="ldr-fact-v">{o.closeLabel}</div></div>
                                                    </div>
                                                </button>
                                            </template>
                                            <template lwc:if={hasMoreOpps}>
                                                <button class="ldr-link-btn ldr-link-teal" onclick={openAccountOpps}>+{moreOppsCount} more → view in Salesforce</button>
                                            </template>
                                        </template>
                                        <div class="ldr-links">
                                            <button class="ldr-link-btn ldr-link-teal" onclick={openMatchedAccount}>Open Account</button>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- FETR (rep hand-off email details), Contact rows -->
                            <template lwc:if={active.showFetr}>
                                <div class="ldr-card">
                                    <div class="ldr-preview-head ldr-fetr-head">
                                        <div class="ldr-fetr-titlegrp">
                                            <div class="ldr-card-title ldr-nowrap">FETR · rep email</div>
                                            <!-- canvas #120: pick the project when the Contact has more than one open project -->
                                            <template lwc:if={active.hasFetrProjects}>
                                                <select class="ldr-fetr-project" aria-label="Project for this FETR" title="Project used for the FETR's Project Name and Split Territory" onchange={handleFetrProject}>
                                                    <template for:each={active.fetrProjects} for:item="fp">
                                                        <option key={fp.value} value={fp.value} selected={fp.selected}>{fp.label}</option>
                                                    </template>
                                                </select>
                                            </template>
                                        </div>
                                        <div class="ldr-fetr-btns">
                                            <template lwc:if={active.fetrEdited}>
                                                <button class="ldr-btn ldr-btn-small ldr-btn-outline ldr-noshrink" onclick={resetFetr} title="Put the Salesforce values back">Reset</button>
                                            </template>
                                            <button class="ldr-btn ldr-btn-small ldr-btn-teal ldr-noshrink" onclick={copyFetr}>Copy FETR</button>
                                        </div>
                                    </div>
                                    <template lwc:if={active.hasFetrProjects}>
                                        <div class={active.fetrProjectNoteCls}>{active.fetrProjectNote}</div>
                                    </template>
                                    <div class="ldr-fetr">
                                        <template for:each={active.fetrRows} for:item="fr">
                                            <div key={fr.key}>
                                                <template lwc:if={fr.isHeader}>
                                                    <div class={fr.cls}>{fr.k}</div>
                                                </template>
                                                <!-- v6f8: every value is editable before copying; ↗ opens a linked one -->
                                                <template lwc:else>
                                                    <div class={fr.rowCls}>
                                                        <strong class="ldr-fetr-k">{fr.k}:</strong>
                                                        <template lwc:if={fr.multi}>
                                                            <textarea class={fr.inCls} rows={fr.lines} data-id={fr.id} data-text={fr.v} oninput={handleFetrEdit} aria-label={fr.k}></textarea>
                                                        </template>
                                                        <template lwc:else>
                                                            <input class={fr.inCls} type="text" data-id={fr.id} value={fr.v} oninput={handleFetrEdit} aria-label={fr.k}>
                                                        </template>
                                                        <template lwc:if={fr.hasHref}>
                                                            <a class="ldr-fetr-open" href={fr.href} target="_blank" rel="noopener" title="Open">↗</a>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <div class="ldr-card">
                                <div class="ldr-card-title">Source &amp; tracking</div>
                                <template lwc:if={active.hasCampaign}>
                                    <div class={active.campaignCardCls}>
                                        <div class="ldr-campaign-kicker">{active.campaignLabel}</div>
                                        <div class="ldr-strong">{active.campaignTitle}</div>
                                        <div class="ldr-small">{active.campaignBody}</div>
                                    </div>
                                </template>
                                <div class="ldr-tracking">
                                    <template for:each={active.tracking} for:item="t">
                                        <div key={t.k}>
                                            <div class="ldr-fact-k">{t.k}</div>
                                            <div class="ldr-fact-v">{t.v}</div>
                                        </div>
                                    </template>
                                </div>
                                <template lwc:if={active.hasUtmContent}>
                                    <div class="ldr-utm-content">
                                        <div class="ldr-fact-k">Ad / content (UTM_Content__c)</div>
                                        <div class="ldr-fact-v">{active.utmContent}</div>
                                    </div>
                                </template>
                                <template lwc:if={active.hasExpectedCampaign}>
                                    <div class="ldr-muted ldr-small ldr-utm-content">This source tracking ({active.expectedCampaignType}) means Eloqua should also add them as a Campaign Member on the matching Salesforce Campaign. Worth checking the Campaigns related list if it's not there.</div>
                                </template>
                                <div class="ldr-links">
                                    <template lwc:if={active.hasPlayback}>
                                        <a href={active.playbackUrl} target="_blank" rel="noopener noreferrer">▶ FullStory session playback</a>
                                    </template>
                                    <button class="ldr-link-btn ldr-link-teal" onclick={openSubmission}>{active.submissionLinkLabel}</button>
                                    <template lwc:if={active.hasLinkedRecord}>
                                        <button class="ldr-link-btn ldr-link-teal" onclick={openLead}>Open in Salesforce</button>
                                    </template>
                                </div>
                            </div>

                            <!-- Eloqua Profiler: the org's existing Profiler_Lead Visualforce page, which iframes
                                 Eloqua's profiler for the Lead's email. Reusing the page avoids a CSP change for eloqua.com. -->
                            <template lwc:if={active.hasLinkedRecord}>
                                <div class="ldr-card">
                                    <div class="ldr-card-title">Eloqua Profiler (Lead Activity Overview)</div>
                                    <iframe class="ldr-profiler" src={active.profilerSrc} title="Eloqua Profiler"></iframe>
                                </div>
                            </template>
                        </div>

                        <!-- RIGHT COLUMN: LDR FIELDS + LEAD HISTORY -->
                        <div class="ldr-col">
                            <div class="ldr-card ldr-fields">
                                <!-- v5.6: "LDR Fields" (14px) with the Project Details button on the right of the same line
                                     (Leads; it opens the Project Details popup). Convert/Hand-off moved under Status. -->
                                <div class="ldr-fields-titlerow">
                                    <div class="ldr-card-title">{active.fieldsTitle}</div>
                                    <template lwc:if={showProjectDetailsBtn}>
                                        <button class="ldr-btn ldr-btn-green-outline ldr-populate-btn" onclick={openProjectDetails}>Project Details</button>
                                    </template>
                                </div>
                                <template lwc:if={showSavingIndicator}>
                                    <div class="ldr-saving"><span class="ldr-saving-dot"></span>Saving Project Coordinator and Lead Funnel Timestamp…</div>
                                </template>
                                <!-- The status buttons and Junk ▾ moved to header line 1 (#152 F / #155 A). -->
                                <template lwc:if={active.notYetLinked}>
                                    <div class="ldr-muted ldr-small">No Lead or Contact linked yet, so there are no fields to edit.</div>
                                </template>
                                <template lwc:if={active.hasLinkedRecord}>
                                    <!-- Project Coordinator: a dropdown of the coordinators only (Aqil, 2026-10-30; was a User
                                         search that also listed people who aren't coordinators). You first, then the rest A-Z,
                                         plus whoever is on the record now. -->
                                    <!-- #152 I: Project Coordinator | Lead Funnel Timestamp, then Status | Lead Funnel Outcome, half
                                         width each; plain labels (#153 C: no API names) -->
                                    <template for:each={active.formKeys} for:item="fk">
                                        <div key={fk} class="ldr-coord-fields ldr-pair">
                                            <div class="ldr-pair-cell">
                                                <lightning-combobox label="Project Coordinator" value={active.coordValue} options={active.coordOptions}
                                                    onchange={handleCoordinatorPick} disabled={active.locked}></lightning-combobox>
                                            </div>
                                            <div class="ldr-pair-cell">
                                                <lightning-input type="date" label="Lead Funnel Timestamp" value={active.funnelTsValue}
                                                    onchange={handleFunnelTs} disabled={active.locked} class="ldr-nowrap-label"></lightning-input>
                                            </div>
                                            <!-- #95: under both fields, full width (v6f7; was under Project Coordinator only) -->
                                            <template lwc:if={active.coordMismatch}>
                                                <div class="ldr-small ldr-warn-text ldr-coord-note">From another submission</div>
                                            </template>
                                        </div>
                                    </template>
                                    <!-- Status Reason isn't edited here any more (2026-10-21). For Wrong profile / Disqualified, Lead Funnel
                                         Outcome shows a * and "Required when Status is …" as a prompt only: it isn't enforced. Editable
                                         wherever Status is (incl. a converted Contact's status saved without claiming). -->
                                    <div class="ldr-pair">
                                        <div class="ldr-pair-cell">
                                            <lightning-combobox label={active.statusLabel} value={draft.status} options={statusOptions}
                                                onchange={handleStatus} disabled={active.statusLocked}></lightning-combobox>
                                        </div>
                                        <div class="ldr-pair-cell">
                                            <lightning-combobox label={outcomeLabel} value={draft.outcome} options={outcomeOptions}
                                                onchange={handleOutcome} disabled={active.statusLocked}></lightning-combobox>
                                            <template lwc:if={outcomeFlagged}>
                                                <div class="ldr-small ldr-error-text">{outcomeFlagText}</div>
                                            </template>
                                        </div>
                                    </div>

                                    <template lwc:if={active.adminEdit}>
                                        <div class="ldr-admin-note">{active.adminEditNote}</div>
                                    </template>
                                    <!-- v5.6: Convert/Hand-off here (was on the LDR Fields title line), claimer only, sized to its
                                         text; disabled while there are unsaved changes. v5.6b: Quick Edit's Cancel / Save on the
                                         same line, on the right ("Unsaved changes" to their left). -->
                                    <template lwc:if={canSaveLdrFields}>
                                        <div class="ldr-handoff-row">
                                            <!-- v5.7: Contacts get Attach to Opportunity here instead of Hand-off (was a full-width
                                                 button under this line); it sets Lead Funnel Status = Qualified and the timestamp to
                                                 today, then opens the Attach to Opportunity flow -->
                                            <template lwc:if={active.isMine}>
                                                <template lwc:if={active.canAttachOpp}>
                                                    <button class="ldr-btn ldr-btn-handoff ldr-handoff-top" onclick={attachOppHandoff} disabled={handoffDisabled} title={handoffTitle}>Attach to Opportunity</button>
                                                </template>
                                                <template lwc:else>
                                                    <button class="ldr-btn ldr-btn-handoff ldr-handoff-top" onclick={handoff} disabled={handoffDisabled} title={handoffTitle}>{handoffLabel}</button>
                                                </template>
                                            </template>
                                            <div class="ldr-qe-actions ldr-save-row">
                                                <template lwc:if={ldrDirty}>
                                                    <span class="ldr-unsaved">Unsaved changes</span>
                                                </template>
                                                <button class="ldr-btn ldr-btn-small" onclick={cancelLdrEdits} disabled={ldrClean}>Cancel</button>
                                                <button class="ldr-btn ldr-btn-primary ldr-btn-small" onclick={save} disabled={busy}>Save</button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- PROJECT DETAILS (v5.6): a centred popup from the Project Details button (was a collapsible
                                         section). Hidden with CSS, not lwc:if, so the form keeps the saved values loaded (unsaved
                                         check, Populate Project). Cancel discards the Project Details edits; Save saves the LDR
                                         fields, like the Save under them, and closes the popup. -->
                                    <template lwc:if={active.showProjectDetails}>
                                        <div class={projectPopupCls} data-close="cancelProjectDetails" onmousedown={overlayDown} onclick={overlayClick}>
                                        <div class="ldr-dialog ldr-dialog-pop ldr-dialog-pd" role="dialog" aria-label="Project Details">
                                            <div class="ldr-pd-titlerow">
                                                <div class="ldr-pop-title">Project Details · {active.name}</div>
                                                <template lwc:if={showPopulateButton}>
                                                    <button class="ldr-btn ldr-btn-green-outline ldr-populate-btn" onclick={populateProject} disabled={active.locked}>Populate Project</button>
                                                </template>
                                            </div>
                                            <div class="ldr-pre-conversion">
                                                <template for:each={active.formKeys} for:item="fk">
                                                    <lightning-record-edit-form key={fk} record-id={active.leadId} object-api-name="Lead" density="comfy" onload={handleProjectFormLoad}>
                                                        <!-- #160: one line, like the other boxes (Project_Name__c is a Text Area, which
                                                             lightning-input-field draws as a multi-line box); kept in the draft, saved with Save -->
                                                        <!-- v5.7: what Populate Project fills in gets ldr-autofilled (pdCls) until it's changed -->
                                                        <lightning-input class={pdCls.name} label="Project Name" value={projectNameValue} max-length="255"
                                                            onchange={handleProjectName} disabled={active.locked}></lightning-input>
                                                        <lightning-input-field class={pdCls.type} field-name="Type_of_record__c" data-field="Type_of_record__c"
                                                            onchange={handlePreField} disabled={active.locked}></lightning-input-field>
                                                        <div class="ldr-pair ldr-pd-approw">
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input-field class={pdCls.industry} field-name="Project_Application_Industry__c" data-field="Project_Application_Industry__c"
                                                                    onchange={handlePreField} disabled={active.locked}></lightning-input-field>
                                                            </div>
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input-field class={pdCls.application} field-name="Project_Application__c" data-field="Project_Application__c"
                                                                    onchange={handlePreField} disabled={active.locked}></lightning-input-field>
                                                            </div>
                                                        </div>
                                                        <!-- canvas #134: Project Site address with Salesforce's Address Search (the Lead page's lookup).
                                                             Values live in the LDR fields draft and are saved with Save, like the other fields. -->
                                                        <lightning-input-address class="ldr-project-address" address-label="Project Site Address"
                                                            address-lookup-label="Search project address" address-lookup-placeholder="Start typing a street, city or zip"
                                                            country-label="Project Site Country" street-label="Project Site Street" city-label="Project Site City"
                                                            province-label="Project Site State" postal-code-label="Project Site Zip"
                                                            street={projectAddr.street} city={projectAddr.city} province={projectAddr.province}
                                                            postal-code={projectAddr.postalCode} country={projectAddr.country}
                                                            country-options={projectCountryOptions} province-options={projectStateOptions}
                                                            show-address-lookup disabled={active.locked} onchange={handleProjectAddress}></lightning-input-address>
                                                        <!-- v5.7b: the address parts Populate Project filled in (the inputs inside the address can't be
                                                             highlighted); a part drops off when it's changed -->
                                                        <template lwc:if={hasAutoFilledAddress}>
                                                            <div class="ldr-autofill-note">Filled in by Populate Project:
                                                                <template for:each={autoFilledAddress} for:item="p">
                                                                    <span key={p.key} class="ldr-autofill-chip">{p.label}</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <!-- v5.6: the Lead page's Project Construction Classification and Project Timeline (v5.6c: under
                                                             Project Site Zip, was under Industry / Application) -->
                                                        <div class="ldr-pair ldr-pd-classrow">
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input-field field-name="Project_Construction_Classification__c" data-field="Project_Construction_Classification__c"
                                                                    onchange={handlePreField} disabled={active.locked}></lightning-input-field>
                                                            </div>
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input-field field-name="Project_Timeline__c" data-field="Project_Timeline__c"
                                                                    onchange={handlePreField} disabled={active.locked}></lightning-input-field>
                                                            </div>
                                                        </div>
                                                        <!-- v5.6: Quote Requested / Reference Opportunity (Lead checkboxes), box left of the name -->
                                                        <div class="ldr-pair ldr-pd-checks">
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input type="checkbox" label="Quote Requested" data-field="Quote_Request__c"
                                                                    checked={quoteRequestedChecked} onchange={handlePreCheckbox} disabled={active.locked}></lightning-input>
                                                            </div>
                                                            <div class="ldr-pair-cell">
                                                                <lightning-input type="checkbox" label="Reference Opportunity" data-field="Reference_Opportunity__c"
                                                                    checked={referenceOppChecked} onchange={handlePreCheckbox} disabled={active.locked}></lightning-input>
                                                            </div>
                                                        </div>
                                                        <!-- hidden: the form loads the saved values (unsaved-changes check) and Populate Project fills them -->
                                                        <div class="ldr-hidden">
                                                            <lightning-input-field field-name="Project_Name__c" data-field="Project_Name__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Project_Site_Country__c" data-field="Project_Site_Country__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Project_Site_Street__c" data-field="Project_Site_Street__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Project_Site_City__c" data-field="Project_Site_City__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Project_Site_State__c" data-field="Project_Site_State__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Project_Site_Zip_Code__c" data-field="Project_Site_Zip_Code__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Quote_Request__c"></lightning-input-field>
                                                            <lightning-input-field field-name="Reference_Opportunity__c"></lightning-input-field>
                                                        </div>
                                                    </lightning-record-edit-form>
                                                </template>
                                            </div>
                                            <!-- Quick Edit's Cancel / Save, bottom right -->
                                            <div class="ldr-qe-actions ldr-pd-actions">
                                                <button class="ldr-btn ldr-btn-small" type="button" onclick={cancelProjectDetails}>Cancel</button>
                                                <template lwc:if={canSaveLdrFields}>
                                                    <button class="ldr-btn ldr-btn-primary ldr-btn-small" type="button" onclick={saveProjectDetails} disabled={busy}>Save</button>
                                                </template>
                                            </div>
                                        </div>
                                        </div>
                                    </template>
                                    <template lwc:if={active.showStatusOnlySave}>
                                        <div class="ldr-muted ldr-small">You can update Lead Funnel Status without claiming this one.</div>
                                        <button class="ldr-btn ldr-btn-outline" onclick={saveStatusOnly} disabled={busy}>Save status</button>
                                    </template>
                                    <template lwc:if={active.notMine}>
                                        <div class="ldr-muted ldr-small">Claim this {active.recordWordLower} to edit its fields.</div>
                                    </template>
                                </template>
                                <!-- Live region stays rendered so screen readers announce each new message. -->
                                <div class="ldr-live" role="status" aria-live="polite">
                                    <template lwc:if={message}>
                                        <div class="ldr-toast">{message}</div>
                                    </template>
                                </div>
                            </div>

                                <template lwc:if={active.showContactOpps}>
                                    <div class="ldr-card">
                                        <div class="ldr-card-title">Open opportunities</div>
                                        <template lwc:if={hasContactOpps}>
                                            <template for:each={contactOpps} for:item="o">
                                                <div key={o.key} class={o.cardCls}>
                                                    <!-- v7 (Aqil): line 1 the tags on the right, line 2 the name on the left -->
                                                    <div class="ldr-opp-head ldr-opp-head-v7">
                                                        <span class="ldr-opp-tags">
                                                            <template lwc:if={o.isSplit}>
                                                                <span class="ldr-tag ldr-tag-split" title="Opportunity owner and Project owner are different">Split Territory</span>
                                                            </template>
                                                            <span class={o.stageCls}>{o.status}</span>
                                                        </span>
                                                        <button class="ldr-link-btn ldr-account-link ldr-opp-namelink" data-id={o.recordId} onclick={openRelated}>{o.name}</button>
                                                    </div>
                                                    <!-- canvas aabc (#96C): Opportunity Owner · Project Owner / Created · Amount (v7: Record Type and
                                                         Close removed) -->
                                                    <div class="ldr-copp-grid ldr-copp-grid-v7">
                                                        <div><div class="ldr-fact-k">Opportunity Owner</div><div class="ldr-fact-v">{o.ownerLabel}</div></div>
                                                        <div><div class="ldr-fact-k">Project Owner</div><div class="ldr-fact-v">{o.projectOwnerLabel}</div></div>
                                                        <div><div class="ldr-fact-k">Created</div><div class="ldr-fact-v">{o.createdLabel}</div></div>
                                                        <div><div class="ldr-fact-k">Amount</div><div class="ldr-fact-v">{o.amountLabel}</div></div>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                        <template lwc:if={noContactOpps}>
                                            <div class="ldr-muted">No open opportunities with this Contact on them.</div>
                                        </template>
                                    </div>
                                </template>

                                <!-- FOLLOW UP INFORMATION: 6Sense Option (own Cancel / Save) + 6sense CE and Outreach fields -->
                                <template lwc:if={active.showFollowUp}>
                                    <div class="ldr-card">
                                        <div class="ldr-card-title">Follow Up Information</div>
                                        <template lwc:if={active.hasSixSense}>
                                            <lightning-combobox label={active.sixSenseLabel} value={active.sixSenseValue} options={sixSenseOptions}
                                                onchange={handleSixSense} disabled={active.locked}></lightning-combobox>
                                        </template>
                                        <div class="ldr-followup">
                                            <template for:each={active.followUpRows} for:item="fu">
                                                <div key={fu.k}>
                                                    <div class="ldr-fact-k">{fu.k}</div>
                                                    <div class={fu.cls}>{fu.v}</div>
                                                </div>
                                            </template>
                                        </div>
                                        <template lwc:if={active.sixSenseDirty}>
                                            <div class="ldr-btn-row ldr-save-row ldr-followup-save">
                                                <span class="ldr-unsaved">Unsaved change</span>
                                                <button class="ldr-btn ldr-btn-text ldr-grow" onclick={cancelSixSense} disabled={busy}>Cancel</button>
                                                <button class="ldr-btn ldr-btn-green-outline ldr-grow" onclick={saveSixSense} disabled={busy}>Save</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <div class="ldr-card">
                                    <div class="ldr-card-title">Activity History (Task)</div>
                                    <template lwc:if={hasActivity}>
                                        <template for:each={activityShown} for:item="act">
                                            <button key={act.key} class={act.rowCls} data-id={act.key} onclick={openActivityPreview} title="Preview">
                                                <lightning-icon icon-name={act.iconName} alternative-text={act.kindLabel} title={act.kindLabel} size="x-small" class="ldr-activity-icon"></lightning-icon>
                                                <span class="ldr-min0">
                                                    <span class="ldr-task-link">{act.label}</span>
                                                    <span class="ldr-small ldr-activity-meta">
                                                        <span class={act.whoCls}>{act.who}</span>
                                                        <template lwc:if={act.isSystem}>
                                                                <span class="ldr-pill-auto">automated</span>
                                                        </template>
                                                        <span class="ldr-muted">&nbsp;· {act.whenLabel}</span>
                                                    </span>
                                                </span>
                                            </button>
                                        </template>
                                    </template>
                                    <template lwc:if={hasMoreActivity}>
                                        <button class="ldr-link-btn ldr-link-green" onclick={toggleActivity}>{activityToggleLabel}</button>
                                    </template>
                                    <template lwc:if={noActivity}>
                                        <div class="ldr-muted">No calls or emails logged in Salesforce yet for this {active.recordWordLower}.</div>
                                    </template>
                                </div>

                                <div class="ldr-card">
                                    <div class="ldr-card-title">{active.historyLabel}</div>
                                    <template lwc:if={hasHistory}>
                                        <template for:each={historyShown} for:item="h">
                                            <div key={h.key} class="ldr-timeline-row">
                                                <div>
                                                    <template lwc:if={h.isCreated}>
                                                        <div class="ldr-strong">Lead created</div>
                                                    </template>
                                                    <template lwc:else>
                                                        <div><strong>{h.label}</strong>: {h.oldLabel} → {h.newLabel}</div>
                                                    </template>
                                                    <div class="ldr-muted ldr-small">by {h.who}</div>
                                                </div>
                                                <div class="ldr-muted ldr-small ldr-nowrap">{h.whenLabel}</div>
                                            </div>
                                        </template>
                                    </template>
                                    <template lwc:if={hasMoreHistory}>
                                        <button class="ldr-link-btn ldr-link-green" onclick={toggleHistory}>{historyToggleLabel}</button>
                                    </template>
                                    <template lwc:if={noHistory}>
                                        <div class="ldr-muted">No tracked field changes yet — this {active.recordObject} hasn't been touched since it came in.</div>
                                    </template>
                                </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- POST QUOTE REPLY (canvas #139-#142): Post Quote tab, or a done reply opened from Finished / All -->
            <template lwc:if={pqDetailVisible}>
                <c-ldr-post-quote row={pqActive} picklists={pqPicklists} viewer-id={viewerId} list-tab={tab}
                    onpostquotechanged={handlePostQuoteChanged} ongototab={handleGoTab}></c-ldr-post-quote>
            </template>
        </div>
        </template>
    </div>
</template>
